# Hyprland-specific Noctalia visual settings for the existing default bar.

[bar.default]
thickness = 36
scale = 1.2
font_scale = 1.0
margin_ends = 100
margin_edge = 0
margin_opposite_edge = 0
padding = 14
radius = 12
radius_top_left = 24
radius_top_right = 24
radius_bottom_left = 12
radius_bottom_right = 12
concave_edge_corners = true
background_opacity = 0.72
shadow = true
border = "#30303A"
border_width = 1.0
color = "#E5E7ED"
icon_color = "#E5E7ED"
capsule_fill = "#202229"
capsule_foreground = "#E5E7ED"
start = ["launcher", "wallpaper", "layout_gap_start", "taskbar", "layout_gap_active", "active_window"]
center = ["clock", "date", "weather"]
end = ["workspaces", "layout_gap_end", "sysmon", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "power_profile", "control-center", "session"]

[widget.layout_gap_start]
type = "spacer"

[widget.layout_gap_active]
type = "spacer"

[widget.layout_gap_end]
type = "spacer"

[widget.workspaces]
capsule = false

[widget.network]
show_label = false

[widget.session]
icon_color = "#72B87A"

[theme]
source = "custom"
custom_palette = "Violet-Noir"
mode = "dark"
shell_mode = "dark"

[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"

[wallpaper.automation]
enabled = true
interval_seconds = 3600
order = "random"
recursive = true

[shell.greeter_sync]
auto_sync = true
