# Hyprland-specific Noctalia visual settings.
# This file is loaded alongside other *.toml files and does not replace them.

[bar.main]
background_opacity = 0.72
shadow = true
border = "#30303A"
border_width = 1.0
color = "#E5E7ED"
icon_color = "#E5E7ED"
capsule_fill = "#202229"
capsule_foreground = "#E5E7ED"

[theme]
source = "custom"
custom_palette = "Violet-Noir"
mode = "dark"
shell_mode = "dark"

[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"

[wallpaper.automation]
enabled = true
interval_seconds = 3600
order = "random"
recursive = true

[shell.greeter_sync]
auto_sync = true
